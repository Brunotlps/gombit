name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Pipeline: lint → build → test → (database ∥ migrations ∥ conformance ∥ contract-drift)
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        run: go build ./...

      # Docs promise these compile. The tutorial example in particular is the
      # committed output of docs/tutorial.md and must not rot.
      - name: Build examples
        run: go build ./examples/...

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run admin UI tests
        working-directory: internal/adminui
        run: npm ci && npm test

      # Parallel packages all shell out to npx; a cold _npx extract races
      # (TAR_ENTRY_ERROR / missing js-yaml) and fails client generation tests.
      - name: Warm npx openapi-typescript cache
        run: npx --yes openapi-typescript@7.13.0 --help >/dev/null

      - name: Run tests
        run: go test ./...

  contract-drift:
    name: Contract drift
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Regenerate sample spec and client
        run: go run ./cmd/gombit client check --write --spec examples/client/openapi.json --out examples/client/frontend/src/api/generated

      - name: Fail on contract drift
        run: git diff --exit-code -- examples/client/openapi.json examples/client/frontend/src/api/generated

  database-sqlite:
    name: Database (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SQLite database tests
        run: go test ./database

  database-postgres:
    name: Database (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres database tests
        run: |
          go test -tags integration ./database \
            -database.postgres-dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          go test -tags integration ./auth \
            -auth.postgres-dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          go test -tags integration ./admin \
            -admin.postgres-dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

      # Separate database from the auth/database/admin tests above: gin-gorm's
      # User model maps to a "users" table, same as auth.User, and the two
      # have different columns -- sharing a database would let one
      # AutoMigrate silently alter the schema the other relies on.
      - name: Create benchmarks database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench;'

      - name: Run gin-gorm benchmark app integration tests
        run: |
          go test -tags integration ./benchmarks/apps/gin-gorm/... \
            -database.dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit_bench?sslmode=disable'

      # A third, separate database: the gombit benchmark app applies its
      # schema via a real Atlas migration (committed under
      # benchmarks/apps/gombit/database/migrations/), not AutoMigrate, so it
      # can't safely share gombit_bench's already-AutoMigrate'd tables
      # either.
      - name: Create gombit benchmark app database
        run: |
          PGPASSWORD=gombit psql -h 127.0.0.1 -U gombit -d gombit \
            -c 'CREATE DATABASE gombit_bench_gombit;'

      - name: Install Atlas CLI
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Apply gombit benchmark app migration
        working-directory: benchmarks/apps/gombit
        env:
          GOMBIT_DATABASE_DRIVER: postgres
          GOMBIT_DATABASE_DSN: postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_gombit?sslmode=disable
        run: go run github.com/gombit-dev/gombit/cmd/gombit db migrate

      - name: Run gombit benchmark app integration tests
        run: |
          go test -tags integration ./benchmarks/apps/gombit/... \
            -database.dsn \
            'postgres://gombit:gombit@127.0.0.1:5432/gombit_bench_gombit?sslmode=disable'

  database-mysql:
    name: Database (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MySQL database tests
        run: |
          go test -tags integration ./database \
            -database.mysql-dsn \
            'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          go test -tags integration ./auth \
            -auth.mysql-dsn \
            'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          go test -tags integration ./admin \
            -admin.mysql-dsn \
            'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  migrations-sqlite:
    name: Migrations (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run migration unit and Atlas smoke tests
        env:
          ATLAS_BINARY: atlas
        run: go test ./migrations ./cmd/gombit

  migrations-postgres:
    name: Migrations (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres migration integration tests
        run: >-
          go test -tags integration ./migrations
          -migrations.postgres-dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

  migrations-mysql:
    name: Migrations (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MySQL migration integration tests
        run: >-
          go test -tags integration ./migrations
          -migrations.mysql-dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  conformance-sqlite:
    name: Conformance (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run SQLite conformance suite
        env:
          ATLAS_BINARY: atlas
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver sqlite
          -count=1

  conformance-postgres:
    name: Conformance (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run Postgres conformance suite
        env:
          ATLAS_BINARY: atlas
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver postgres
          -conformance.dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          -count=1

  conformance-mysql:
    name: Conformance (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run MySQL conformance suite
        env:
          ATLAS_BINARY: atlas
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver mysql
          -conformance.dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          -count=1
