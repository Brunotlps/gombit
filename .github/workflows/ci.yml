name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test ./...

  database:
    name: Database (${{ matrix.driver }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver:
          - sqlite
          - postgres
          - mysql
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SQLite database tests
        if: matrix.driver == 'sqlite'
        run: go test ./database

      - name: Run Postgres database tests
        if: matrix.driver == 'postgres'
        run: >-
          go test -tags integration ./database
          -database.postgres-dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

      - name: Run MySQL database tests
        if: matrix.driver == 'mysql'
        run: >-
          go test -tags integration ./database
          -database.mysql-dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        driver:
          - sqlite
          - postgres
          - mysql
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run migration unit tests
        if: matrix.driver == 'sqlite'
        env:
          ATLAS_BINARY: atlas
        run: go test ./migrations ./cmd/gombit

      - name: Run Postgres migration integration tests
        if: matrix.driver == 'postgres'
        run: >-
          go test -tags integration ./migrations
          -migrations.postgres-dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

      - name: Run MySQL migration integration tests
        if: matrix.driver == 'mysql'
        run: >-
          go test -tags integration ./migrations
          -migrations.mysql-dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
