name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Pipeline: lint → build → test → (database ∥ migrations ∥ conformance ∥ contract-drift)
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  build:
    name: Build
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build packages
        run: go build ./...

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run tests
        run: go test ./...

  contract-drift:
    name: Contract drift
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Regenerate sample spec and client
        run: go run ./cmd/gombit client check --write

      - name: Fail on contract drift
        run: git diff --exit-code -- examples/client/openapi.json examples/client/frontend/src/api/generated

  database-sqlite:
    name: Database (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run SQLite database tests
        run: go test ./database

  database-postgres:
    name: Database (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres database tests
        run: >-
          go test -tags integration ./database
          -database.postgres-dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

  database-mysql:
    name: Database (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MySQL database tests
        run: >-
          go test -tags integration ./database
          -database.mysql-dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  migrations-sqlite:
    name: Migrations (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run migration unit and Atlas smoke tests
        env:
          ATLAS_BINARY: atlas
        run: go test ./migrations ./cmd/gombit

  migrations-postgres:
    name: Migrations (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run Postgres migration integration tests
        run: >-
          go test -tags integration ./migrations
          -migrations.postgres-dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'

  migrations-mysql:
    name: Migrations (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run MySQL migration integration tests
        run: >-
          go test -tags integration ./migrations
          -migrations.mysql-dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'

  conformance-sqlite:
    name: Conformance (sqlite)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run SQLite conformance suite
        env:
          ATLAS_BINARY: atlas
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver sqlite
          -count=1

  conformance-postgres:
    name: Conformance (postgres)
    needs: test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gombit
          POSTGRES_PASSWORD: gombit
          POSTGRES_DB: gombit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gombit -d gombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run Postgres conformance suite
        env:
          ATLAS_BINARY: atlas
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver postgres
          -conformance.dsn
          'postgres://gombit:gombit@127.0.0.1:5432/gombit?sslmode=disable'
          -count=1

  conformance-mysql:
    name: Conformance (mysql)
    needs: test
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gombit
          MYSQL_USER: gombit
          MYSQL_PASSWORD: gombit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -ugombit -pgombit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Atlas Community Edition
        run: curl -sSf https://atlasgo.sh | sh -s -- --community

      - name: Run MySQL conformance suite
        env:
          ATLAS_BINARY: atlas
        run: >-
          go test -tags conformance ./database/conformance
          -conformance.driver mysql
          -conformance.dsn
          'gombit:gombit@tcp(127.0.0.1:3306)/gombit?parseTime=true'
          -count=1
