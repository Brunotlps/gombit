; Production PHP-FPM pool for the BENCH-1 Laravel app (issue #141 §17/§18).
;
; Unlike the other benchmarks/apps/ implementations — which keep the
; framework booted across requests in a long-lived process (a Go binary,
; Puma cluster, gunicorn workers) — traditional PHP-FPM re-bootstraps Laravel
; on every request; there is no persistent in-process app state between
; requests. That is how the large majority of Laravel deployments actually
; run in production, and it is the model this suite pins for the Laravel row
; (documented here and in README.md so the published numbers are read with
; that in mind, not mistaken for a persistent-worker setup like Octane).
;
; Connection pooling (§18): PHP-FPM has no persistent DB connection pool the
; way a single long-lived process does — each request opens and closes its
; own PDO connection (PDO::ATTR_PERSISTENT is off by default and left off).
; The analog to the pinned "20 max open connections" is therefore the cap on
; how many FPM worker processes can run concurrently, since that bounds the
; number of simultaneous connections. pm=static with pm.max_children=20 pins
; exactly that ceiling — at most 20 workers, hence at most 20 concurrent
; Postgres connections, matching the 20 every other implementation pins.
; PHP-FPM glob-merges every php-fpm.d/*.conf into the same-named [www] pool,
; with later files overriding only the keys they restate. The official
; php:8.3-fpm image ships docker.conf (access.log = /proc/self/fd/2,
; clear_env = no) and zz-docker.conf, so this file MUST restate every directive
; whose base-image value would otherwise leak in, and MUST be installed as a
; file that sorts after them (zzz-bench.conf) so it wins. The two that bite:
; access.log (base turns per-request logging ON — §19 wants it off) and
; clear_env (FPM's own default is yes, which would wipe DATABASE_URL/APP_KEY
; from workers). Both are set explicitly below rather than inherited.
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = static
pm.max_children = 20

; §19: no per-request access logging during a benchmark run (the nginx vhost
; disables its access log too). docker.conf sets access.log = /proc/self/fd/2,
; which writes a line per request into the container logs; override it off.
access.log = /dev/null

; Keep worker environment (DATABASE_URL / APP_KEY) — FPM's default clear_env=yes
; would wipe it and Laravel could not read the DB config. Set explicitly so the
; app does not depend on the base image's docker.conf for this.
clear_env = no

; Pool/worker errors are still logged (not a line per request).
php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
catch_workers_output = yes
