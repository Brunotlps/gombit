# Production nginx vhost for the BENCH-1 Laravel app (issue #141 §17/§19).
# Serves the app through PHP-FPM (deploy/php-fpm.conf) with the public/
# directory as the document root — the standard Laravel production topology,
# not `php artisan serve`.
server {
    listen 8084;
    server_name 127.0.0.1 localhost;
    root /app/public;
    index index.php;

    # issue #141 §19: no per-request access logging during a benchmark run
    # (it "can massively distort synthetic benchmarks"). Errors are still
    # logged.
    access_log off;
    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
