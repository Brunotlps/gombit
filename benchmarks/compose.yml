# PostgreSQL + the benchmark app services under test. App services are added
# as each is containerized (Phase 6 compose loop): the two Go apps `gin-gorm`
# (the reference control) and `gombit` (same API on the Gombit runtime) plus the
# `django` ecosystem app are in; rails / laravel / nestjs are the next slices.
#
# Version pin: issue #141 requires major.minor (or digest), not a
# major-only floating tag. The pin lives once in
# benchmarks/config/versions.env (POSTGRES_IMAGE); this file references it via
# ${POSTGRES_IMAGE}. Run compose with that env file so the two can't drift:
#
#   docker compose --env-file benchmarks/config/versions.env \
#     -f benchmarks/compose.yml up -d postgres gin-gorm
#
#   # seed the deterministic dataset once (truncate + insert), then it serves:
#   docker compose --env-file benchmarks/config/versions.env \
#     -f benchmarks/compose.yml run --rm gin-gorm seed
#
#   # confirm the §7 ceiling actually landed — do NOT trust the file, trust the
#   # running container (benchmarks/scripts/inspect-limits):
#   go run ./benchmarks/scripts/inspect-limits \
#     -container "$(docker compose -f benchmarks/compose.yml ps -q gin-gorm)" \
#     -cpus "$APP_CPUS" -memory "$APP_MEMORY"
#
# On the deploy.resources.limits below: Docker Compose v2 enforces them on a
# plain `up` (verified locally against Compose v5.x — the container comes up
# with NanoCpus/Memory set). Older Compose (v1, and early v2 that needed
# `--compatibility`), Swarm-mode stacks, or a host without the cgroup
# controllers can silently leave them off, which is exactly why the intended
# budget is verified against the live container rather than assumed from here.
#
# The `:-...` defaults keep a bare `docker compose up` (no env file) working
# with the same pinned image and limits.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.4-alpine}
    environment:
      POSTGRES_USER: gombit
      POSTGRES_PASSWORD: gombit
      POSTGRES_DB: gombit_bench
    # gin-gorm uses gombit_bench (POSTGRES_DB above); the gombit app needs a
    # separate gombit_bench_gombit (real Atlas migration, not AutoMigrate — see
    # benchmarks/apps/gombit/README.md). It is created idempotently by the
    # gombit `migrate` verb on every bring-up, NOT by docker-entrypoint-initdb.d
    # — that runs only on a fresh data volume, so on this suite's already-
    # initialized volume it would never fire, and `down -v` to force it would
    # wipe gin-gorm's seed.
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gombit -d gombit_bench"]
      interval: 2s
      timeout: 2s
      retries: 30
    # Issue #141 resource-limits requirement: 2 vCPU / 2 GiB for PostgreSQL.
    # Compose v2 enforces deploy.resources.limits on a plain `up`, but whether
    # they land is engine/version/host-dependent (older Compose, Swarm, or a
    # host missing cgroup controllers can drop them), so the suite verifies the
    # running container rather than trusting these keys — benchmarks/scripts/
    # inspect-limits detects and reports the truth (issue: "detect/report that
    # fact rather than silently pretending limits were applied").
    deploy:
      resources:
        limits:
          cpus: "${POSTGRES_CPUS:-2}"
          memory: ${POSTGRES_MEMORY:-2g}

  # The gin-gorm control app (issue #141 §7 app budget: 2 vCPU / 1 GiB). Built
  # from the repo root (the Go module root) because it imports
  # benchmarks/apps/shared; the Dockerfile-scoped .dockerignore keeps the
  # context small. Whether the deploy.resources.limits below are honored is
  # engine/version-dependent — inspect-limits reports whether they actually were.
  gin-gorm:
    build:
      context: ..
      dockerfile: benchmarks/apps/gin-gorm/Dockerfile
    image: bench-gin-gorm:local
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://gombit:gombit@postgres:5432/gombit_bench?sslmode=disable
      PORT: "8081"
      POOL_MAX_OPEN: "${POOL_MAX_OPEN:-20}"
      POOL_MAX_IDLE: "${POOL_MAX_IDLE:-20}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    # Probe /livez (registered by newRouter, no DB touch — the same readiness
    # route the fairness harness and the other apps standardize on), never the
    # measured /api/projects route: the check ticks forever, so a data-plane
    # probe would add COUNT+page+preload traffic to the SUT (under its §7
    # ceiling) on every interval. The next apps' services copy this one.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8081/livez' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: ${APP_MEMORY:-1g}

  # The gombit app (issue #141 §7 app budget: 2 vCPU / 1 GiB) — same canonical
  # API as gin-gorm, on the Gombit runtime. Its image also carries the `gombit`
  # CLI and the pinned `atlas` binary because migrations are applied as a
  # separate step (real Atlas versioned migrations, not AutoMigrate), on its own
  # gombit_bench_gombit database. `serve` does not migrate — bring it up in
  # order, applying migrations (which also creates the database) and seeding as
  # one-shots first:
  #
  #   docker compose ... up -d postgres
  #   docker compose ... run --rm gombit migrate
  #   docker compose ... run --rm gombit seed
  #   docker compose ... up -d gombit
  gombit:
    build:
      context: ..
      dockerfile: benchmarks/apps/gombit/Dockerfile
      args:
        ATLAS_IMAGE: ${ATLAS_IMAGE:-arigaio/atlas:0.36.0-alpine}
    image: bench-gombit:local
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://gombit:gombit@postgres:5432/gombit_bench_gombit?sslmode=disable
      # The migrate verb creates TARGET_DB if absent, connecting via
      # ADMIN_DATABASE_URL (an existing DB on the same server) — idempotent,
      # every bring-up, no fresh-volume dependency.
      ADMIN_DATABASE_URL: postgres://gombit:gombit@postgres:5432/gombit_bench?sslmode=disable
      TARGET_DB: gombit_bench_gombit
      PORT: "8080"
      POOL_MAX_OPEN: "${POOL_MAX_OPEN:-20}"
      POOL_MAX_IDLE: "${POOL_MAX_IDLE:-20}"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    # /livez is served by framework.App with no DB touch (framework/app.go) —
    # same rule as gin-gorm: never probe the measured route.
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8080/livez' || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: ${APP_MEMORY:-1g}

  # The django app (issue #141 §7 app budget: 2 vCPU / 1 GiB) — Python/DRF
  # ecosystem context, not a framework-tax control. Self-contained, so the build
  # context is the app dir. Same three-verb bring-up as gombit; `migrate` ensures
  # its own gombit_bench_django database. gunicorn (WSGI, §17) with
  # GUNICORN_WORKERS workers, the value settings.py divides POOL_MAX_OPEN by:
  #
  #   docker compose ... up -d postgres
  #   docker compose ... run --rm django migrate
  #   docker compose ... run --rm django seed
  #   docker compose ... up -d django
  django:
    build:
      context: apps/django
    image: bench-django:local
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://gombit:gombit@postgres:5432/gombit_bench_django?sslmode=disable
      ADMIN_DATABASE_URL: postgres://gombit:gombit@postgres:5432/gombit_bench?sslmode=disable
      TARGET_DB: gombit_bench_django
      PORT: "8082"
      GUNICORN_WORKERS: "4"
      POOL_MAX_OPEN: "${POOL_MAX_OPEN:-20}"
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8082"
    # /livez returns 200 with no DB touch (config/urls.py) — never the measured
    # route. The slim image has no wget/curl, so probe with python's urllib.
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8082/livez').status==200 else 1)\""]
      interval: 3s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits:
          cpus: "${APP_CPUS:-2}"
          memory: ${APP_MEMORY:-1g}
