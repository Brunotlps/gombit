root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/server"
  cmd = "go build -o ./tmp/server ./cmd/server"
  delay = 200
  exclude_dir = ["tmp", "frontend", "node_modules", "vendor", "database", "testdata"]
  exclude_regex = ["_test.go"]
  include_ext = ["go"]
  send_interrupt = true

[log]
  time = false
